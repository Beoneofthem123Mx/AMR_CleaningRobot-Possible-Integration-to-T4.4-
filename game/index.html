<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marea Humana</title>
<meta name="description" content="Planea el recinto de un concierto en la plaza para que miles de personas entren, disfruten y salgan sin que nadie salga pisoteado.">
<style>
@font-face { font-family: "Rubik"; font-weight: 500; src: url("fonts/rubik-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Rubik"; font-weight: 700; src: url("fonts/rubik-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Rubik"; font-weight: 900; src: url("fonts/rubik-latin-900-normal.woff2") format("woff2"); }
/* Layout: a vertical "phone video" frame showing the plaza from above, tool bar under it. One committed look: dark surround, daylight concrete inside. */
:root {
  color-scheme: dark;
  --surround: #141516;
  --bar: #1f2123;
  --bar-line: #34383b;
  --text: #f1f1ee;
  --muted: #9da3a6;
  --paper: #ffffff;
  --ink: #111214;
  --danger: #e53229;
  --caution: #ffd23a;
  --go: #ffd23a;
  --font: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--surround); color: var(--text); font-family: var(--font); overflow: hidden; }
.app { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px; }
.wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.frame { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #bdbdb8; }
canvas { display: block; touch-action: none; }
canvas.ov { position: absolute; left: 0; top: 0; pointer-events: none; }
.badge {
  position: absolute; top: 3.2%; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: .45em; padding: .32em .4em .32em .7em;
  background: var(--paper); color: var(--ink); border: .2em solid var(--ink); border-radius: .7em;
  box-shadow: 0 .18em 0 rgba(0,0,0,.35); font-weight: 900; letter-spacing: .02em; white-space: nowrap; pointer-events: none;
}
.badge svg { width: 1.15em; height: 1.15em; }
.badge .num {
  color: var(--danger); background: var(--paper); border: .14em solid var(--ink); border-radius: .5em;
  min-width: 1.2em; text-align: center; padding: 0 .25em; font-variant-numeric: tabular-nums; font-size: 1.15em; line-height: 1.1;
}
.badge.pop { animation: pop .4s; }
@keyframes pop { 35% { transform: translateX(-50%) scale(1.22) rotate(-3deg); } }
.caption {
  position: absolute; left: 6%; right: 6%; top: 57%; text-align: center; pointer-events: none;
  font-weight: 900; text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; text-wrap: balance;
  color: var(--paper); text-shadow: 0 .06em .18em rgba(0,0,0,.55), 0 0 .5em rgba(0,0,0,.25);
  transition: opacity .35s;
}
.caption.yellow { color: var(--caution); }
.status {
  position: absolute; left: 50%; top: calc(3.2% + 2.9em); transform: translateX(-50%); white-space: nowrap; pointer-events: none; font-size: .78em;
  background: rgba(17,18,20,.72); color: var(--text); border-radius: 99px; padding: .3em .9em; font-weight: 700; font-variant-numeric: tabular-nums;
}
.overlay { position: absolute; inset: 0; display: flex; overflow: auto; padding: 14px; background: rgba(10,10,12,.42); }
.card {
  margin: auto; max-width: 340px; box-sizing: border-box; background: var(--paper); color: var(--ink);
  border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.4);
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; font-size: .92rem;
}
.card h2 { margin: 0; font-weight: 900; font-size: 1.45rem; line-height: 1.05; text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; line-height: 1.45; }
.card ul { margin: 0; padding-left: 18px; line-height: 1.5; color: #45494c; }
.card .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; font-variant-numeric: tabular-nums; }
.card .stats span:nth-child(even) { font-weight: 900; text-align: right; }
.stars { font-size: 2rem; letter-spacing: .08em; color: var(--caution); -webkit-text-stroke: 2px var(--ink); }
.stars .off { color: #d9d9d4; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: 700 .88rem var(--font); color: var(--text); background: var(--bar); border: 2px solid var(--bar-line);
  border-radius: 999px; padding: 8px 13px; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--caution); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
button.on { background: var(--text); color: var(--ink); border-color: var(--text); }
button.go { background: var(--go); color: var(--ink); border-color: var(--go); font-weight: 900; }
.card button { color: var(--ink); background: var(--paper); border: 3px solid var(--ink); }
.card button.go { background: var(--caution); }
.scenes { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.card button.scene:disabled { opacity: .55; }
.card:has(.scenes) { max-width: 640px; }
.card button.scene .lock { font-weight: 700; color: #8a5a00; font-size: .8rem; }
.card button.scene { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border-radius: 12px; padding: 10px 12px; }
.card button.scene b { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; }
.card button.scene span { font-weight: 700; color: #45494c; font-size: .82rem; }
.card button.scene small { font-weight: 500; color: #5d6266; font-size: .8rem; line-height: 1.35; }
.card button.scene:hover { background: #fff6cf; }
.card .best { font-style: normal; color: #d9a400; letter-spacing: .05em; font-size: .95rem; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 100%; }
.bar .sep { width: 1px; background: var(--bar-line); margin: 4px 2px; }
.cnt { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .badge.pop { animation: none; } .caption { transition: none; } }

/* chip con la condición del día */
.modchip { position: absolute; left: 1.2%; top: 2.2%; background: var(--caution); color: var(--ink); border: .14em solid var(--ink); border-radius: .5em;
  padding: .2em .55em; font-weight: 900; font-size: .72em; text-transform: uppercase; letter-spacing: .02em; pointer-events: none; box-shadow: 0 .12em 0 rgba(0,0,0,.35); max-width: 30%; }
/* pantalla de título */
.card.menu { max-width: 760px; max-height: calc(100% - 8px); overflow: auto; }
.title { text-align: center; padding: 4px 0 2px; }
.logo { margin: 0; font-weight: 900; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: .9; letter-spacing: .01em; color: var(--paper);
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--caution), 0 8px 0 var(--ink); transform: rotate(-2deg); }
.tag { margin: 10px 0 0; font-weight: 700; color: #45494c; }
.starline { font-size: .9rem; }
.card button.scene { flex-direction: row; align-items: stretch; gap: 10px; padding: 8px; }
.card button.scene img { width: 108px; height: 60px; border-radius: 6px; border: 2px solid var(--ink); object-fit: cover; flex: none; background: #ddd; }
.card button.scene .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card.menu .scenes { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
/* ruleta */
.roulette { text-align: center; padding: 10px 6px; min-width: 260px; }
.roulette small { font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: #8a5a00; }
.roulette h2 { font-size: 1.9rem; margin: 8px 0; min-height: 2.2em; display: grid; place-items: center; }
/* el periódico */
.card.report { max-width: 720px; max-height: calc(100% - 8px); overflow: auto; background: #f4efe3; }
.paper { font-family: Georgia, "Times New Roman", "DejaVu Serif", serif; color: #1a1a1a; }
.paper .mast { display: flex; flex-direction: column; align-items: center; border-bottom: 3px double #1a1a1a; padding-bottom: 6px; margin-bottom: 10px; }
.paper .mast span { font-family: var(--font); font-weight: 900; font-size: 2rem; letter-spacing: .04em; }
.paper .mast small { font-style: italic; color: #555; }
.paper .head { font-family: var(--font); font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2rem); line-height: 1.05; margin: 0 0 10px; text-transform: none; }
.paper figure { margin: 0 0 10px; }
.paper figure img { width: 100%; max-height: 240px; object-fit: cover; filter: grayscale(1) contrast(1.15); border: 1px solid #1a1a1a; display: block; }
.paper figcaption { font-size: .78rem; font-style: italic; color: #555; margin-top: 3px; }
.paper .cols { display: grid; grid-template-columns: 1fr 210px; gap: 14px; }
.paper .story p { margin: 0 0 8px; line-height: 1.45; }
.paper .quote { font-style: italic; border-left: 3px solid #1a1a1a; padding-left: 8px; }
.paper .box { border: 2px solid #1a1a1a; padding: 8px; font-family: var(--font); font-size: .85rem; background: #fffdf6; }
@media (max-width: 560px) { .paper .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <div class="wrap" id="wrap">
    <div class="frame" id="frame">
      <canvas id="cv" aria-label="Vista aérea del recinto"></canvas>
      <canvas id="ov" class="ov" aria-hidden="true"></canvas>
      <div class="badge" id="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#111214" d="M12 2C6.9 2 3 5.6 3 10.3c0 2.7 1.3 4.9 3.4 6.3V20c0 1.1.9 2 2 2h7.2c1.1 0 2-.9 2-2v-3.4c2.1-1.4 3.4-3.6 3.4-6.3C21 5.6 17.1 2 12 2Zm-3.6 11.6a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2Zm7.2 0a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2ZM10 22v-2.4h1.2V22H10Zm2.8 0v-2.4H14V22h-1.2Z"/></svg>
        <span>PISOTEADOS</span><span class="num" id="dead">0</span>
      </div>
      <div class="caption" id="caption">Tú lo planeas</div>
      <div class="status" id="status" hidden></div>
      <div class="modchip" id="mod" hidden></div>
      <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
    </div>
  </div>
  <div class="bar" id="bar">
    <button id="tFence" data-tool="fence" class="on">Valla <span class="cnt" id="cFence">60 m</span></button>
    <button id="tGate" data-tool="gate">Puertas <span class="cnt" id="cGate">3/5</span></button>
    <button id="tGuard" data-tool="guard">Seguridad <span class="cnt" id="cGuard">3</span></button>
    <button id="tErase" data-tool="erase">Borrar</button>
    <button id="bScene">Escenario</button>
    <span class="sep"></span>
    <button id="bHeat">Presión</button>
    <button id="bSpeed">1×</button>
    <button id="bCam">Cámara: auto</button>
    <button id="bSound">Sonido: sí</button>
    <button id="bGo" class="go">Abrir puertas</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/scenes/plaza.js"></script>
<script src="js/scenes/circo.js"></script>
<script src="js/scenes/estadio.js"></script>
<script src="js/scenes/viernes.js"></script>
<script src="js/scenes/crucero.js"></script>
<script src="js/scenes/boda.js"></script>
<script src="js/scenes/hipodromo.js"></script>
<script src="js/scenes/trono.js"></script>
<script src="js/scenes/ciudad.js"></script>
<script src="js/scenes/mitin.js"></script>
<script src="js/scenes/taco.js"></script>
<script src="js/scenes/ovni.js"></script>
<script src="js/scenes/aeropuerto.js"></script>
<script src="js/audio.js"></script>
<script src="js/movers.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
<script src="js/modifiers.js"></script>
<script src="js/menus.js"></script>
<script src="js/render.js"></script>
<script src="js/models.js"></script>
<script src="js/main.js"></script>

</body>
</html>
