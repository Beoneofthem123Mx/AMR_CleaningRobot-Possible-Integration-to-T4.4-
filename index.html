<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marea Humana</title>
<meta name="description" content="Planea el recinto de un concierto en la plaza para que miles de personas entren, disfruten y salgan sin que nadie salga pisoteado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap">
<style>
/* Layout: a vertical "phone video" frame showing the plaza from above, tool bar under it. One committed look: dark surround, daylight concrete inside. */
:root {
  color-scheme: dark;
  --surround: #141516;
  --bar: #1f2123;
  --bar-line: #34383b;
  --text: #f1f1ee;
  --muted: #9da3a6;
  --paper: #ffffff;
  --ink: #111214;
  --danger: #e53229;
  --caution: #ffd23a;
  --go: #ffd23a;
  --font: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--surround); color: var(--text); font-family: var(--font); overflow: hidden; }
.app { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px; }
.wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.frame { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #bdbdb8; }
canvas { display: block; touch-action: none; }
.badge {
  position: absolute; top: 3.2%; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: .45em; padding: .32em .4em .32em .7em;
  background: var(--paper); color: var(--ink); border: .2em solid var(--ink); border-radius: .7em;
  box-shadow: 0 .18em 0 rgba(0,0,0,.35); font-weight: 900; letter-spacing: .02em; white-space: nowrap; pointer-events: none;
}
.badge svg { width: 1.15em; height: 1.15em; }
.badge .num {
  color: var(--danger); background: var(--paper); border: .14em solid var(--ink); border-radius: .5em;
  min-width: 1.2em; text-align: center; padding: 0 .25em; font-variant-numeric: tabular-nums; font-size: 1.15em; line-height: 1.1;
}
.badge.pop { animation: pop .4s; }
@keyframes pop { 35% { transform: translateX(-50%) scale(1.22) rotate(-3deg); } }
.caption {
  position: absolute; left: 6%; right: 6%; top: 57%; text-align: center; pointer-events: none;
  font-weight: 900; text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; text-wrap: balance;
  color: var(--paper); text-shadow: 0 .06em .18em rgba(0,0,0,.55), 0 0 .5em rgba(0,0,0,.25);
  transition: opacity .35s;
}
.caption.yellow { color: var(--caution); }
.status {
  position: absolute; left: 50%; top: 10.5%; transform: translateX(-50%); white-space: nowrap; pointer-events: none; font-size: .78em;
  background: rgba(17,18,20,.72); color: var(--text); border-radius: 99px; padding: .3em .9em; font-weight: 700; font-variant-numeric: tabular-nums;
}
.overlay { position: absolute; inset: 0; display: flex; overflow: auto; padding: 14px; background: rgba(10,10,12,.42); }
.card {
  margin: auto; max-width: 340px; box-sizing: border-box; background: var(--paper); color: var(--ink);
  border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.4);
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; font-size: .92rem;
}
.card h2 { margin: 0; font-weight: 900; font-size: 1.45rem; line-height: 1.05; text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; line-height: 1.45; }
.card ul { margin: 0; padding-left: 18px; line-height: 1.5; color: #45494c; }
.card .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; font-variant-numeric: tabular-nums; }
.card .stats span:nth-child(even) { font-weight: 900; text-align: right; }
.stars { font-size: 2rem; letter-spacing: .08em; color: var(--caution); -webkit-text-stroke: 2px var(--ink); }
.stars .off { color: #d9d9d4; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: 700 .88rem var(--font); color: var(--text); background: var(--bar); border: 2px solid var(--bar-line);
  border-radius: 999px; padding: 8px 13px; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--caution); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
button.on { background: var(--text); color: var(--ink); border-color: var(--text); }
button.go { background: var(--go); color: var(--ink); border-color: var(--go); font-weight: 900; }
.card button { color: var(--ink); background: var(--paper); border: 3px solid var(--ink); }
.card button.go { background: var(--caution); }
.scenes { display: grid; gap: 8px; }
.card button.scene { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border-radius: 12px; padding: 10px 12px; }
.card button.scene b { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; }
.card button.scene span { font-weight: 700; color: #45494c; font-size: .82rem; }
.card button.scene small { font-weight: 500; color: #5d6266; font-size: .8rem; line-height: 1.35; }
.card button.scene:hover { background: #fff6cf; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 100%; }
.bar .sep { width: 1px; background: var(--bar-line); margin: 4px 2px; }
.cnt { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .badge.pop { animation: none; } .caption { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="wrap" id="wrap">
    <div class="frame" id="frame">
      <canvas id="cv" aria-label="Vista aérea de la plaza y el escenario"></canvas>
      <div class="badge" id="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#111214" d="M12 2C6.9 2 3 5.6 3 10.3c0 2.7 1.3 4.9 3.4 6.3V20c0 1.1.9 2 2 2h7.2c1.1 0 2-.9 2-2v-3.4c2.1-1.4 3.4-3.6 3.4-6.3C21 5.6 17.1 2 12 2Zm-3.6 11.6a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2Zm7.2 0a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2ZM10 22v-2.4h1.2V22H10Zm2.8 0v-2.4H14V22h-1.2Z"/></svg>
        <span>PISOTEADOS</span><span class="num" id="dead">0</span>
      </div>
      <div class="caption" id="caption">Tú lo planeas</div>
      <div class="status" id="status" hidden></div>
      <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
    </div>
  </div>
  <div class="bar" id="bar">
    <button id="tFence" data-tool="fence" class="on">Valla <span class="cnt" id="cFence">60 m</span></button>
    <button id="tGate" data-tool="gate">Puertas <span class="cnt" id="cGate">3/5</span></button>
    <button id="tErase" data-tool="erase">Borrar</button>
    <button id="bScene">Escenario</button>
    <span class="sep"></span>
    <button id="bHeat">Presión</button>
    <button id="bSpeed">1×</button>
    <button id="bGo" class="go">Abrir puertas</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
// ===== Mundo (metros) =====
const WW = 40, WH = 72, SH = 78, CS = .5, GW = WW / CS, GH = SH / CS;  // SH: la calle sigue fuera de cuadro
const R = .24, DT = 1 / 60;
let PCRIT = 8.5;
let CROWD = 3200, FENCE_BUDGET = 60, MAX_GATES = 5;
const SHOW_TIME = 40;
const FENCE_Y = 66, SLOTS = 7, SLOT_W = 2.6;
const slotX = i => WW * (i + .5) / SLOTS;
let gates = [false, false, true, false, true, false, false], scene;
let fences = [];           // vallas del jugador {ax,ay,bx,by,len}

// ===== Obstáculos =====
let obs = [], buckets, BKS = 2, BW = Math.ceil(WW / BKS), BH = Math.ceil(SH / BKS);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function seg(ax, ay, bx, by, th, kind) { obs.push({ t: "s", ax, ay, bx, by, th, kind }); }
function rect(x0, y0, x1, y1, kind) { obs.push({ t: "r", x0, y0, x1, y1, kind }); }
function circ(x, y, r, kind) { obs.push({ t: "c", x, y, r, kind }); }
// ===== Escenarios =====
const F = false, T = true;
const hazardLine = (g, ax, ay, bx, by, w) => {
  g.lineCap = "butt"; g.lineWidth = w; g.strokeStyle = "#e9b923"; g.setLineDash([]);
  g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
  g.strokeStyle = "#1c1c1c"; g.setLineDash([.45, .45]); g.stroke(); g.setLineDash([]);
};
function ringSegs(cx, cy, r, n, kind, skip) {
  for (let k = 0; k < n; k++) {
    const a0 = (k + .5) / n * Math.PI * 2, a1 = (k + 1.5) / n * Math.PI * 2;
    const ax = cx + Math.cos(a0) * r, ay = cy + Math.sin(a0) * r, bx = cx + Math.cos(a1) * r, by = cy + Math.sin(a1) * r;
    if (skip((ax + bx) / 2, (ay + by) / 2)) continue;
    seg(ax, ay, bx, by, .5, kind);
    obs[obs.length - 1].alt = k % 2;
  }
}
const RING = { x: 20, y: 21.5, r: 4.8 };     // plaza: plataforma redonda
const PISTA = { x: 20, y: 25, r: 7.6 };      // circo: la pista

const SCENES = {
  plaza: {
    name: "La Plaza", tag: "Concierto gratis", crowd: 3200, fenceBudget: 60, maxGates: 5, gates: [F, F, T, F, T, F, F],
    intro: "Hoy hay concierto gratis en la plaza. Por la plaza también pasan coches, perros y pelotas gigantes.",
    acts: ["¡Suena su éxito!", "¡Todos al frente!", "¡Que suene el bajo!", "¡Empujones!"],
    events: ["car", "dogs", "beachballs", "icecream", "car", "dogs"],
    goal: o => o.kind === "barrier", goalMaxY: 30,
    build() {
      rect(6, 0, 34, 11, "stage");
      rect(2.6, 7.4, 4.8, 9.6, "speaker"); rect(35.2, 7.4, 37.4, 9.6, "speaker");
      rect(18.6, 11, 21.4, 18.5, "catwalk");
      circ(RING.x, RING.y, 3.2, "platform");
      seg(0, 12.6, 17, 12.6, .5, "barrier"); seg(23, 12.6, WW, 12.6, .5, "barrier");
      seg(17, 12.6, 17, 18.4, .5, "barrier"); seg(23, 12.6, 23, 18.4, .5, "barrier");
      ringSegs(RING.x, RING.y, RING.r, 12, "barrier", (x, y) => y < RING.y - 2.5 && Math.abs(x - RING.x) < 3);
      rect(17.5, 39.5, 22.5, 44.5, "tent");
      rect(2.5, 52, 5.5, 55, "booth");
      rect(34.5, 52, 37.5, 55, "aid");
    },
    ground(g, px) {
      g.fillStyle = "#bdbdb8"; g.fillRect(0, 0, WW, WH);
      g.fillStyle = "#b3b4af"; g.fillRect(0, FENCE_Y, WW, WH - FENCE_Y);
      g.lineWidth = px; g.strokeStyle = "rgba(255,255,255,.14)"; g.beginPath();
      for (let x = 0; x <= WW; x += 1) { g.moveTo(x, 0); g.lineTo(x, WH); }
      for (let y = 0; y <= WH; y += 1) { g.moveTo(0, y); g.lineTo(WW, y); }
      g.stroke();
      g.strokeStyle = "rgba(0,0,0,.07)"; g.beginPath();
      for (let x = 0; x <= WW; x += 4) { g.moveTo(x, 0); g.lineTo(x, WH); }
      for (let y = 0; y <= WH; y += 4) { g.moveTo(0, y); g.lineTo(WW, y); }
      g.stroke();
      const rand = rng(7), conf = ["#ff9ec7", "#9be7ff", "#ffe48a", "#b9a6ff", "#ffb38a", "#ffffff"];
      for (let k = 0; k < 1400; k++) { g.fillStyle = conf[k % conf.length]; g.globalAlpha = .55; g.fillRect(rand() * WW, rand() * WH, .09, .09); }
      g.globalAlpha = 1;
      hazardLine(g, 20, 26.3, 20, 37, .18); hazardLine(g, 0, 50, 13, 50, .18); hazardLine(g, 27, 48.5, WW, 48.5, .18);
    },
    decor(g) {
      g.fillStyle = "#dcdcd8"; g.fillRect(6, 0, 28, 11);
      g.strokeStyle = "#3a3c3e"; g.lineWidth = .14; g.strokeRect(6.4, .4, 27.2, 10.2);
      g.setLineDash([.25, .25]); g.lineWidth = .3;
      for (const y of [1.6, 6.3, 10.1]) { g.beginPath(); g.moveTo(6.6, y); g.lineTo(33.4, y); g.stroke(); }
      g.setLineDash([]);
      g.lineWidth = .08; g.strokeStyle = "rgba(0,0,0,.25)";
      for (const x of [12, 20, 28]) { g.beginPath(); g.moveTo(x, .4); g.lineTo(x, 10.6); g.stroke(); }
      g.fillStyle = "#2a2b2d";
      [[8, 2.6, 3, 1.4], [12.6, 3.4, 1.2, .6], [24.6, 3.4, 1.2, .6], [28.6, 2.8, 1.4, .8], [9, 7.6, 1, .5], [30, 7.6, 1, .5], [14, 8, .8, .5], [25, 8, .8, .5]].forEach(([x, y, w, h]) => g.fillRect(x, y, w, h));
      g.fillStyle = "#5a3b1f"; g.fillRect(18.6, 3, 2.8, 2.2);
      g.fillStyle = "#c7883a"; for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) if ((i + j) % 2) g.fillRect(18.7 + i * .65, 3.1 + j * .65, .55, .55);
      g.fillStyle = "#151617";
      for (const o of obs) if (o.kind === "speaker") { g.fillRect(o.x0, o.y0, (o.x1 - o.x0) / 2 - .05, o.y1 - o.y0); g.fillRect(o.x0 + (o.x1 - o.x0) / 2 + .05, o.y0 + .5, (o.x1 - o.x0) / 2 - .05, o.y1 - o.y0 - .5); }
      g.fillStyle = "#d4d4d0"; g.fillRect(18.6, 11, 2.8, 8);
      g.fillStyle = "#ececea"; g.beginPath(); g.arc(RING.x, RING.y, 3.2, 0, 7); g.fill();
      g.strokeStyle = "#2f3133"; g.lineWidth = .4; g.beginPath(); g.arc(RING.x, RING.y, 1.6, 0, 7); g.stroke();
      for (const o of obs) if (o.kind === "barrier") {
        g.lineCap = "square"; g.lineWidth = o.th; g.strokeStyle = "#26282a"; g.beginPath(); g.moveTo(o.ax, o.ay); g.lineTo(o.bx, o.by); g.stroke();
        g.lineWidth = o.th * .3; g.strokeStyle = "#4a4d50"; g.stroke();
      }
      g.fillStyle = "#ebebe8"; g.fillRect(17.5, 39.5, 5, 5);
      g.fillStyle = "#d7d7d3"; g.beginPath(); g.moveTo(22.5, 39.5); g.lineTo(22.5, 44.5); g.lineTo(20, 42); g.fill();
      g.fillStyle = "#cfcfcb"; g.beginPath(); g.moveTo(17.5, 44.5); g.lineTo(22.5, 44.5); g.lineTo(20, 42); g.fill();
      g.fillStyle = "#2f7fd6"; g.fillRect(2.5, 52, 3, 3); g.strokeStyle = "#215da0"; g.lineWidth = .15; g.strokeRect(2.6, 52.1, 2.8, 2.8);
      g.fillStyle = "#f2f2ef"; g.fillRect(34.5, 52, 3, 3);
      g.fillStyle = "#d8322b"; g.fillRect(35.75, 52.6, .5, 1.8); g.fillRect(35.1, 53.25, 1.8, .5);
    },
    bulbs: Array.from({ length: 14 }, (_, i) => [7 + i * 2, 11.25]),
    beams: Array.from({ length: 6 }, (_, i) => ({ x: 8 + i * 4.8, y: 11, a: Math.PI / 2, sweep: .65 })),
    performers: () => [],
  },

  circo: {
    name: "El Circo", tag: "Función de gala", crowd: 2800, fenceBudget: 70, maxGates: 5, gates: [F, T, F, F, F, T, F],
    intro: "Función de gala bajo la carpa. Los animales no siempre se quedan en la pista: leones, elefantes, el coche de los payasos y la bala humana.",
    acts: ["¡Ta-dá!", "¡Aplausos!", "¡El gran final!", "¡Más fuerte!"],
    events: ["lion", "elephants", "clowncar", "balls", "cannon", "unicycles", "lion", "cannon"],
    goal: o => o.kind === "curb", goalMaxY: FENCE_Y,
    build() {
      rect(0, 0, 1.4, FENCE_Y, "canvas"); rect(WW - 1.4, 0, WW, FENCE_Y, "canvas"); rect(0, 0, WW, 1.4, "canvas");
      rect(11, 1.4, 29, 5, "curtain");
      seg(17, 5, 17, 18.3, .5, "wall"); seg(23, 5, 23, 18.3, .5, "wall");
      ringSegs(PISTA.x, PISTA.y, PISTA.r, 24, "curb", (x, y) => y < PISTA.y && Math.abs(x - PISTA.x) < 3.2);
      circ(7, 25, .6, "pole"); circ(33, 25, .6, "pole"); circ(20, 45, .6, "pole");
      rect(3, 51, 7, 54.5, "popcorn"); rect(33, 51, 37, 54.5, "candy");
      rect(32.5, 5.5, 37.2, 9.5, "cannon");
    },
    ground(g) {
      g.fillStyle = "#d4bc8a"; g.fillRect(0, 0, WW, FENCE_Y);
      g.fillStyle = "#79a25a"; g.fillRect(0, FENCE_Y, WW, WH - FENCE_Y);
      const rand = rng(11);
      for (let k = 0; k < 2600; k++) { g.fillStyle = k % 3 ? "rgba(120,86,40,.18)" : "rgba(255,245,215,.35)"; g.fillRect(rand() * WW, rand() * FENCE_Y, .12, .07); }
      for (let k = 0; k < 900; k++) { g.fillStyle = k % 2 ? "rgba(40,80,30,.25)" : "rgba(170,210,120,.3)"; g.fillRect(rand() * WW, FENCE_Y + rand() * (WH - FENCE_Y), .08, .2); }
      g.fillStyle = "#c9b38a"; g.fillRect(0, 69, WW, 1.6);
      const conf = ["#ff6fb1", "#5fd8ff", "#ffe066", "#a98bff", "#ffffff"];
      for (let k = 0; k < 700; k++) { g.fillStyle = conf[k % conf.length]; g.globalAlpha = .6; g.fillRect(rand() * WW, rand() * FENCE_Y, .09, .09); }
      g.globalAlpha = 1;
    },
    decor(g) {
      // lona de la carpa a rayas rojas y blancas
      const stripes = (x0, y0, x1, y1, vertical) => {
        g.save(); g.beginPath(); g.rect(x0, y0, x1 - x0, y1 - y0); g.clip();
        for (let s = 0, i = 0; s < (vertical ? y1 - y0 : x1 - x0); s += 1.2, i++) {
          g.fillStyle = i % 2 ? "#f3e7cf" : "#cf2f2c";
          if (vertical) g.fillRect(x0, y0 + s, x1 - x0, 1.2); else g.fillRect(x0 + s, y0, 1.2, y1 - y0);
        }
        g.restore();
      };
      stripes(0, 0, 1.4, FENCE_Y, true); stripes(WW - 1.4, 0, WW, FENCE_Y, true); stripes(0, 0, WW, 1.4, false);
      g.fillStyle = "#e3b23c"; g.fillRect(1.4, 1.4, WW - 2.8, .15); g.fillRect(1.4, 1.4, .15, FENCE_Y - 1.4); g.fillRect(WW - 1.55, 1.4, .15, FENCE_Y - 1.4);
      // telón y pasillo de artistas
      g.fillStyle = "#8f1b24"; g.fillRect(11, 1.4, 18, 3.6);
      g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = .12;
      for (let x = 11.6; x < 29; x += .9) { g.beginPath(); g.moveTo(x, 1.5); g.lineTo(x, 5); g.stroke(); }
      g.fillStyle = "#e3b23c"; g.fillRect(11, 1.4, 18, .35); g.fillRect(11, 4.7, 18, .3);
      g.font = "900 2.1px Rubik, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#f5d36b"; g.fillText("CIRCO", 20, 3.25);
      g.fillStyle = "#c4aa77"; g.fillRect(17, 5, 6, 13.5);
      g.fillStyle = "#b2232c"; g.fillRect(19, 5, 2, 13.5);
      for (const o of obs) if (o.kind === "wall") { g.lineCap = "square"; g.lineWidth = o.th; g.strokeStyle = "#5b2a1c"; g.beginPath(); g.moveTo(o.ax, o.ay); g.lineTo(o.bx, o.by); g.stroke(); }
      // pista
      g.fillStyle = "#e8d3a2"; g.beginPath(); g.arc(PISTA.x, PISTA.y, PISTA.r, 0, 7); g.fill();
      g.strokeStyle = "rgba(150,110,60,.18)"; g.lineWidth = .1;
      for (let r = 1.5; r < PISTA.r; r += 1.5) { g.beginPath(); g.arc(PISTA.x, PISTA.y, r, 0, 7); g.stroke(); }
      g.fillStyle = "#e3b23c"; g.beginPath();
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .7 : 1.6; g.lineTo(PISTA.x + Math.cos(a) * r, PISTA.y + Math.sin(a) * r); }
      g.fill();
      for (const o of obs) if (o.kind === "curb") {
        g.lineCap = "butt"; g.lineWidth = .62; g.strokeStyle = o.alt ? "#f4ecd8" : "#c8282a";
        g.beginPath(); g.moveTo(o.ax, o.ay); g.lineTo(o.bx, o.by); g.stroke();
      }
      // mástiles
      for (const o of obs) if (o.kind === "pole") {
        g.fillStyle = "#4a3426"; g.beginPath(); g.arc(o.x, o.y, o.r, 0, 7); g.fill();
        g.strokeStyle = "#c9a14a"; g.lineWidth = .15; g.beginPath(); g.arc(o.x, o.y, o.r * .7, 0, 7); g.stroke();
      }
      // puestos de palomitas y algodón de azúcar
      const stand = (o, a, b, top) => {

  if (first && !quiet) caption("Y eso no nos gusta.", true, 2600);
}
function showCard(html) { $("#card").innerHTML = html; $("#overlay").hidden = false; const b = $("#card .go"); if (b) b.focus(); }
function hideCard() { $("#overlay").hidden = true; }
function ui() {
  const plan = phase === "plan";
  $("#cFence").textContent = `${Math.round(FENCE_BUDGET - fenceUsed())} m`;
  $("#cGate").textContent = `${gates.filter(Boolean).length}/${MAX_GATES}`;
  document.querySelectorAll("[data-tool]").forEach(b => { b.disabled = !plan; b.classList.toggle("on", b.dataset.tool === tool); });
  $("#bGo").textContent = plan ? "Abrir puertas" : phase === "done" ? "Abrir puertas" : "Detener";
  $("#bGo").disabled = phase === "done";
  $("#status").hidden = plan;
  $("#bScene").disabled = !plan;
}
document.querySelectorAll("[data-tool]").forEach(b => b.addEventListener("click", () => {
  tool = b.dataset.tool; ui();
  if (tool === "gate") toast("Toca la reja de abajo para abrir o cerrar puertas.");
}));
$("#bGo").addEventListener("click", () => phase === "plan" ? start() : backToPlan());
let heat = false, speed = 1;
$("#bHeat").addEventListener("click", () => { heat = !heat; $("#bHeat").classList.toggle("on", heat); });
$("#bSpeed").addEventListener("click", () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $("#bSpeed").textContent = speed + "×"; });
$("#card").addEventListener("click", e => {
  const sk = e.target.closest("[data-scene]");
  if (sk) { loadScene(sk.dataset.scene); hideCard(); caption("Tú lo planeas", false, 0); }
  if (e.target.id === "retry") backToPlan();
  if (e.target.id === "pick") chooser();
});

// ===== Dibujo =====
let S = 10, dpr = 1, staticLayer = null, atlas = null, SP = 8;
function resize() {
  const r = $("#wrap").getBoundingClientRect();
  const w = Math.min(r.width, r.height * WW / WH), h = w * WH / WW;
  dpr = Math.min(2, window.devicePixelRatio || 1); S = w / WW;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  $("#frame").style.fontSize = Math.max(11, w * .042) + "px";
  staticLayer = null; atlas = null; trailCv = null;
}
new ResizeObserver(resize).observe($("#wrap"));

function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
function buildStatic() {
  const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height;
  const g = c.getContext("2d"); g.scale(S * dpr, S * dpr);
  const px = 1 / (S * dpr);
  scene.ground(g, px);
  // sombras
  for (const o of obs) {
    if (o.kind === "edge" || o.kind === "canvas" || o.kind === "fence" || o.kind === "closed") continue;
    const sx = .55, sy = .75;
    g.fillStyle = "rgba(0,0,0,.22)";
    if (o.t === "r") g.fillRect(o.x0 + sx, o.y0 + sy, o.x1 - o.x0, o.y1 - o.y0);
    else if (o.t === "c") { g.beginPath(); g.arc(o.x + sx, o.y + sy, o.r, 0, 7); g.fill(); }
    else { g.lineWidth = o.th; g.strokeStyle = "rgba(0,0,0,.2)"; g.lineCap = "square"; g.beginPath(); g.moveTo(o.ax + sx * .6, o.ay + sy * .6); g.lineTo(o.bx + sx * .6, o.by + sy * .6); g.stroke(); }
  }
  scene.decor(g);
  // reja y puertas
  for (const o of obs) if (o.kind === "fence" || o.kind === "closed") {
    g.lineCap = "butt"; g.lineWidth = .16; g.strokeStyle = o.kind === "closed" ? "#6f716f" : "#8a8c89";
    g.beginPath(); g.moveTo(o.ax, o.ay); g.lineTo(o.bx, o.by); g.stroke();
    g.fillStyle = "#5e605e"; for (let x = o.ax; x <= o.bx; x += 2) g.fillRect(x - .08, o.ay - .12, .16, .24);
  }
  for (let i = 0; i < SLOTS; i++) {
    const cx = slotX(i);
    if (gates[i]) {
      g.fillStyle = "#d8322b";
      for (const s of [-1, 1]) { g.fillRect(cx + s * SLOT_W / 2 - .15, FENCE_Y - .9, .3, 1.8); }
      g.strokeStyle = "rgba(216,50,43,.85)"; g.lineWidth = .12; g.strokeRect(cx - SLOT_W / 2, FENCE_Y - .9, SLOT_W, 1.8);
    } else {
      g.strokeStyle = "#6f716f"; g.lineWidth = .1;
      for (let x = cx - SLOT_W / 2; x < cx + SLOT_W / 2; x += .5) { g.beginPath(); g.moveTo(x, FENCE_Y - .3); g.lineTo(x + .5, FENCE_Y + .3); g.stroke(); }
    }
  }
  // vallas del jugador
  for (const f of fences) drawFence(g, f);
  return c;
}
function drawFence(g, f, ghost) {
  g.lineCap = "round"; g.lineWidth = .35; g.strokeStyle = ghost ? "rgba(255,210,58,.6)" : "#f2c230";
  g.beginPath(); g.moveTo(f.ax, f.ay); g.lineTo(f.bx, f.by); g.stroke();
  g.lineCap = "butt"; g.strokeStyle = "#1c1c1c"; g.setLineDash([.5, .5]); g.lineWidth = .35; g.stroke(); g.setLineDash([]);
}

// sprites de personas vistas desde arriba: 16 orientaciones × colores
const ANG = 16, HAIR = ["#2b1d14", "#14110f", "#6b4a2b", "#c9a15a", "#3b2a20"];
function buildAtlas() {
  SP = Math.max(6, Math.ceil(S * dpr * .95));
  const cols = SHIRTS.concat(HEAT);
  const a = document.createElement("canvas"); a.width = SP * ANG; a.height = SP * cols.length;
  const g = a.getContext("2d"), m = S * dpr;
  cols.forEach((col, ci) => {
    for (let k = 0; k < ANG; k++) {
      const th = k / ANG * Math.PI * 2;
      g.save(); g.translate(k * SP + SP / 2, ci * SP + SP / 2);
      g.fillStyle = "rgba(0,0,0,.3)"; g.beginPath(); g.ellipse(.1 * m, .14 * m, .25 * m, .17 * m, th + Math.PI / 2, 0, 7); g.fill();
      g.rotate(th);
      g.fillStyle = col; g.beginPath(); g.ellipse(0, 0, .12 * m, .24 * m, 0, 0, 7); g.fill();
      g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(-.03 * m, 0, .07 * m, .2 * m, 0, 0, 7); g.fill();
      g.fillStyle = ci < SHIRTS.length ? HAIR[ci % HAIR.length] : "#2a1c12"; g.beginPath(); g.arc(.02 * m, 0, .095 * m, 0, 7); g.fill();
      g.restore();
    }
  });
  return a;
}

// ===== Efectos: cámara, estelas, luces, confeti =====
const CONF = ["#ff6fb1", "#5fd8ff", "#ffe066", "#a98bff", "#ff9a5c", "#ffffff", "#7dff9e"];
const TRAIL = Array.from({ length: 12 }, (_, i) => { const q = i / 11; return `rgba(${Math.round(255 - 55 * q)},${Math.round(140 + 95 * q)},${Math.round(50 + 205 * q)},.6)`; });
let cam = { z: 1, x: WW / 2, y: WH / 2 }, shake = 0, heatMix = 0, flash = 0, rings = [], confetti = [], trailCv = null, tctx = null;
function resetFx() { cam = { z: 1, x: WW / 2, y: WH / 2 }; shake = 0; flash = 0; rings = []; confetti = []; trailCv = null; }
function burst(n) {
  for (let i = 0; i < n; i++) {
    const a = Math.PI / 2 + (Math.random() - .5) * 2.4, v = 4 + Math.random() * 12;
    const b = scene.beams[(Math.random() * scene.beams.length) | 0];
    confetti.push({ x: b.x + (Math.random() - .5) * 6, y: b.y + .5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - .5) * 14, c: CONF[i % CONF.length], life: 2 + Math.random() * 2.5 });
  }
}
function burstAt(x, y, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 2 + Math.random() * 9; confetti.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - .5) * 14, c: CONF[i % CONF.length], life: 1.5 + Math.random() * 2 }); }
}
function onDrop(first) {
  flash = 1; burst(260);
  caption(first ? "Física de multitudes real" : scene.acts[(Math.random() * scene.acts.length) | 0], false, 1900);
}
function onFall(x, y) { rings.push({ x, y, t: 0 }); shake = Math.min(.9, shake + .35); }
function updateFx(dt) {
  let tz = 1, ty = WH / 2;
  if (phase === "show" || phase === "evac") {
    let sy = 0, n = 0;
    for (let i = 0; i < ag.length; i += 5) { const a = ag[i]; if (a.y < FENCE_Y) { sy += a.y; n++; } }
    tz = phase === "show" ? (surgeT > 0 ? 1.34 : 1.18) : 1.06;
    if (n > 40) ty = sy / n;
  }
  const kz = 1 - Math.pow(.3, dt);
  cam.z += (tz - cam.z) * kz; cam.y += (ty - cam.y) * kz * .6;
  const hw = WW / (2 * cam.z), hh = WH / (2 * cam.z);
  cam.x = clamp(WW / 2, hw, WW - hw); cam.y = clamp(cam.y, hh, WH - hh);
  shake *= Math.pow(.03, dt); flash *= Math.pow(.04, dt);
  heatMix += ((heat || surgeT > 0 ? 1 : 0) - heatMix) * (1 - Math.pow(.015, dt));
  for (const r of rings) r.t += dt; rings = rings.filter(r => r.t < 1.3);
  for (const q of pops) q.t += dt; pops = pops.filter(q => q.t < 1.6);
  stepPerformers(dt);
  const drag = Math.pow(.25, dt);
  for (const c of confetti) { c.vx *= drag; c.vy *= drag; c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; c.life -= dt; }
  confetti = confetti.filter(c => c.life > 0);
}
function updateTrails() {
  if (!trailCv) { trailCv = document.createElement("canvas"); trailCv.width = cv.width; trailCv.height = cv.height; tctx = trailCv.getContext("2d"); }
  tctx.globalCompositeOperation = "destination-out"; tctx.fillStyle = "rgba(0,0,0,.06)"; tctx.fillRect(0, 0, trailCv.width, trailCv.height);
  tctx.globalCompositeOperation = "source-over";
  const k = S * dpr, s = Math.max(1, .16 * k);
  for (const a of ag) {
    if (a.vx * a.vx + a.vy * a.vy < .3 || a.y > WH) continue;
    const f = fStage[cellOf(a.x, a.y)];
    tctx.fillStyle = TRAIL[isFinite(f) ? clamp(Math.floor(f / 50 * 11), 0, 11) : 11];
    tctx.fillRect(a.x * k - s / 2, a.y * k - s / 2, s, s);
  }
}

function draw(now) {
  if (!staticLayer) staticLayer = buildStatic();
  if (!atlas) atlas = buildAtlas();
  const k = S * dpr, z = cam.z;
  const ox = cv.width / 2 - cam.x * k * z + (Math.random() - .5) * shake * k, oy = cv.height / 2 - cam.y * k * z + (Math.random() - .5) * shake * k;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#bdbdb8"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(z, 0, 0, z, ox, oy);
  ctx.drawImage(staticLayer, 0, 0);
  // focos del escenario
  const live = phase === "show" || phase === "evac";
  scene.bulbs.forEach(([x, y], i) => {
    const on = live ? .4 + .6 * Math.max(0, Math.sin(now / (surgeT > 0 ? 90 : 220) + i * .9)) : .8;
    ctx.globalAlpha = on; ctx.fillStyle = ["#ff9ec7", "#9be7ff", "#ffe48a", "#b9a6ff", "#ffb38a"][i % 5];
    ctx.beginPath(); ctx.arc(x * k, y * k, .22 * k, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // estelas de la gente que camina
  if (live) { updateTrails(); ctx.globalAlpha = .9; ctx.drawImage(trailCv, 0, 0); ctx.globalAlpha = 1; }
  // estelas de flujo previsto
  if (phase === "plan") {
    ctx.lineCap = "round"; ctx.lineWidth = Math.max(1, .22 * k);
    for (const p of preview) {
      const tr = p.trail; if (tr.length < 6) continue;
      const fade = Math.min(1, p.age / .6, (p.life - p.age) / .8);
      for (let i = 3; i < tr.length; i += 3) {
        const q = clamp(tr[i + 2] / 60, 0, 1), a = (i / tr.length) * .55 * fade;
        ctx.strokeStyle = `rgba(${Math.round(255 - q * 50)},${Math.round(140 + q * 95)},${Math.round(60 + q * 195)},${a.toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(tr[i - 3] * k, tr[i - 2] * k); ctx.lineTo(tr[i] * k, tr[i + 1] * k); ctx.stroke();
      }
    }
  }
  if (drag) { ctx.save(); ctx.scale(k, k); drawFence(ctx, drag, true); ctx.restore(); }
  // caídos
  ctx.strokeStyle = "#e53229"; ctx.lineWidth = Math.max(1.5, .1 * k); ctx.beginPath();
  for (const [x, y] of fallen) { const s = .22 * k; ctx.moveTo(x * k - s, y * k - s); ctx.lineTo(x * k + s, y * k + s); ctx.moveTo(x * k + s, y * k - s); ctx.lineTo(x * k - s, y * k + s); }
  ctx.stroke();
  // artistas en la pista
  for (const q of performers) drawThing(q, k, now);
  // personas: ropa de colores que se funde con el color de presión
  const hm = heatMix, red = SHIRTS.length + HEAT.length - 1;
  for (const a of ag) {
    if (a.y > WH + .5) continue;
    const ai = ((Math.round(a.h / (Math.PI * 2) * ANG) % ANG) + ANG) % ANG;
    const sz = a.dance ? SP * (1 + .09 * Math.sin(now / 85 + a.ph * 3)) : SP;
    const x = a.x * k - sz / 2, y = a.y * k - sz / 2;
    if (hm < .97) { ctx.globalAlpha = 1; ctx.drawImage(atlas, ai * SP, (a.dmg > .45 ? red : a.c) * SP, SP, SP, x, y, sz, sz); }
    if (hm > .03) {
      const hi = SHIRTS.length + clamp(Math.floor(a.ps / PCRIT * HEAT.length), 0, HEAT.length - 1);
      ctx.globalAlpha = hm; ctx.drawImage(atlas, ai * SP, hi * SP, SP, SP, x, y, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
  // animales, coches y objetos
  for (const m of movers) if (!m.air) drawThing(m, k, now);
  for (const m of movers) if (m.air) drawThing(m, k, now);
  // anillos de caída
  ctx.lineWidth = Math.max(1.5, .14 * k);
  for (const r of rings) { ctx.strokeStyle = `rgba(229,50,41,${(1 - r.t / 1.3).toFixed(3)})`; ctx.beginPath(); ctx.arc(r.x * k, r.y * k, (.3 + r.t * 1.8) * k, 0, 7); ctx.stroke(); }
  // confeti
  for (const c of confetti) {
    ctx.globalAlpha = Math.min(1, c.life); ctx.fillStyle = c.c;
    const w = Math.max(1, .3 * k * Math.abs(Math.cos(c.r))), h = Math.max(1, .16 * k);
    ctx.fillRect(c.x * k - w / 2, c.y * k - h / 2, w, h);
  }
  ctx.globalAlpha = 1;
  // onomatopeyas
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  ctx.font = `900 ${Math.round(.95 * k)}px Rubik, system-ui, sans-serif`;
  for (const q of pops) {
    const a = Math.min(1, (1.6 - q.t) / .5), y = (q.y - q.t * 1.3) * k, sc = 1 + Math.max(0, .25 - q.t) * 2;
    ctx.save(); ctx.translate(q.x * k, y); ctx.scale(sc, sc); ctx.globalAlpha = a;
    ctx.lineWidth = .22 * k; ctx.strokeStyle = "#111214"; ctx.strokeText(q.text, 0, 0); ctx.fillStyle = "#ffd23a"; ctx.fillText(q.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // haces de luz del escenario
  const inten = phase === "show" ? (fullAt ? 1 : .45) + (surgeT > 0 ? .9 : 0) : phase === "evac" ? .3 : 0;
  if (inten > 0) {
    ctx.globalCompositeOperation = "screen";
    scene.beams.forEach((bm, i) => {
      const bx = bm.x * k, by = bm.y * k, ang = bm.a + Math.sin(now / (surgeT > 0 ? 380 : 1000 + i * 130) + i * 1.7) * bm.sweep, len = 36 * k, wd = .15;
      const hue = (now / 22 + i * 60) % 360;
      const g = ctx.createLinearGradient(bx, by, bx + Math.cos(ang) * len, by + Math.sin(ang) * len);
      g.addColorStop(0, `hsla(${hue},100%,62%,${Math.min(.6, .28 * inten).toFixed(3)})`); g.addColorStop(1, `hsla(${hue},100%,62%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(ang - wd) * len, by + Math.sin(ang - wd) * len);
      ctx.lineTo(bx + Math.cos(ang + wd) * len, by + Math.sin(ang + wd) * len); ctx.fill();
    });
    ctx.globalCompositeOperation = "source-over";
  }
  if (flash > .01) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${(flash * .22).toFixed(3)})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}

// ===== Bucle =====
let last = performance.now();
function frame(now) {
  const real = Math.min(.1, (now - last) / 1000); last = now;
  if (phase === "show" || phase === "evac") {
    const n = Math.min(10, Math.round(real / DT * speed));
    for (let i = 0; i < n && (phase === "show" || phase === "evac"); i++) step();
    $("#status").textContent = phase === "show"
      ? (spawned < CROWD ? `Entrando ${spawned} / ${CROWD}` : `En el show · termina en ${Math.max(0, Math.ceil(fullAt + SHOW_TIME - t))} s`)
      : `Evacuando · quedan ${ag.length}`;
  } else if (phase === "plan") stepPreview(real);
  updateFx(real * (phase === "show" || phase === "evac" ? speed : 1));
  draw(now);
  requestAnimationFrame(frame);
}

window.__game = { mp: (a, b, c) => { MPUSH = a; MPRES = b; MSCARE = c; }, scene: k => loadScene(k), setP: v => PCRIT = v, setSurge: v => SURGE = v, step, start, get s() { return { phase, dead, evacuated, left: ag.length, spawned, t, evacT }; },
  get ag() { return ag; }, setGates: g => { gates = g; buildWorld(); }, addFence: f => { fences.push({ ...f, len: Math.hypot(f.bx - f.ax, f.by - f.ay) }); buildWorld(); }, reset: () => { fences = []; backToPlan(); } };

function loadScene(key) {
  scene = SCENES[key]; CROWD = scene.crowd; FENCE_BUDGET = scene.fenceBudget; MAX_GATES = scene.maxGates;
  gates = scene.gates.slice(); fences = []; performers = scene.performers();
  buildWorld(); backToPlan();
}
function chooser() {
  if (phase === "show" || phase === "evac") return;
  showCard(`<h2>Marea Humana</h2>
    <p>Tú eres responsable de la seguridad. Traza vallas y abre puertas antes de que entre la gente. Si alguien aguanta demasiada presión, cae y lo pisotean.</p>
    <ul>
      <li><b>Valla:</b> arrastra para trazar una valla.</li>
      <li><b>Puertas:</b> toca la reja de abajo para abrir o cerrar entradas.</li>
      <li><b>Presión:</b> pinta a la multitud de azul a rojo.</li>
    </ul>
    <p><b>Elige escenario:</b></p>
    <div class="scenes">${Object.entries(SCENES).map(([key, sc]) => `<button class="scene" data-scene="${key}"><b>${sc.name}</b><span>${sc.tag} · ${sc.crowd.toLocaleString("es")} personas</span><small>${sc.intro}</small></button>`).join("")}</div>`);
  const b = $("#card .scene"); if (b) b.focus();
}
$("#bScene").addEventListener("click", chooser);
resize(); loadScene("plaza"); chooser();
requestAnimationFrame(frame);
</script>
