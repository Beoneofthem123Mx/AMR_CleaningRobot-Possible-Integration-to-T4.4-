<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marea Humana</title>
<meta name="description" content="Planea el recinto de un concierto en la plaza para que miles de personas entren, disfruten y salgan sin que nadie salga pisoteado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap">
<style>
/* Layout: a vertical "phone video" frame showing the plaza from above, tool bar under it. One committed look: dark surround, daylight concrete inside. */
:root {
  color-scheme: dark;
  --surround: #141516;
  --bar: #1f2123;
  --bar-line: #34383b;
  --text: #f1f1ee;
  --muted: #9da3a6;
  --paper: #ffffff;
  --ink: #111214;
  --danger: #e53229;
  --caution: #ffd23a;
  --go: #ffd23a;
  --font: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--surround); color: var(--text); font-family: var(--font); overflow: hidden; }
.app { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px; }
.wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.frame { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #bdbdb8; }
canvas { display: block; touch-action: none; }
.badge {
  position: absolute; top: 3.2%; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: .45em; padding: .32em .4em .32em .7em;
  background: var(--paper); color: var(--ink); border: .2em solid var(--ink); border-radius: .7em;
  box-shadow: 0 .18em 0 rgba(0,0,0,.35); font-weight: 900; letter-spacing: .02em; white-space: nowrap; pointer-events: none;
}
.badge svg { width: 1.15em; height: 1.15em; }
.badge .num {
  color: var(--danger); background: var(--paper); border: .14em solid var(--ink); border-radius: .5em;
  min-width: 1.2em; text-align: center; padding: 0 .25em; font-variant-numeric: tabular-nums; font-size: 1.15em; line-height: 1.1;
}
.badge.pop { animation: pop .4s; }
@keyframes pop { 35% { transform: translateX(-50%) scale(1.22) rotate(-3deg); } }
.caption {
  position: absolute; left: 6%; right: 6%; top: 57%; text-align: center; pointer-events: none;
  font-weight: 900; text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; text-wrap: balance;
  color: var(--paper); text-shadow: 0 .06em .18em rgba(0,0,0,.55), 0 0 .5em rgba(0,0,0,.25);
  transition: opacity .35s;
}
.caption.yellow { color: var(--caution); }
.status {
  position: absolute; left: 50%; bottom: 2.4%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  background: rgba(17,18,20,.72); color: var(--text); border-radius: 99px; padding: .3em .9em; font-weight: 700; font-variant-numeric: tabular-nums;
}
.overlay { position: absolute; inset: 0; display: flex; overflow: auto; padding: 14px; background: rgba(10,10,12,.42); }
.card {
  margin: auto; max-width: 340px; box-sizing: border-box; background: var(--paper); color: var(--ink);
  border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.4);
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; font-size: .92rem;
}
.card h2 { margin: 0; font-weight: 900; font-size: 1.45rem; line-height: 1.05; text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; line-height: 1.45; }
.card ul { margin: 0; padding-left: 18px; line-height: 1.5; color: #45494c; }
.card .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; font-variant-numeric: tabular-nums; }
.card .stats span:nth-child(even) { font-weight: 900; text-align: right; }
.stars { font-size: 2rem; letter-spacing: .08em; color: var(--caution); -webkit-text-stroke: 2px var(--ink); }
.stars .off { color: #d9d9d4; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: 700 .88rem var(--font); color: var(--text); background: var(--bar); border: 2px solid var(--bar-line);
  border-radius: 999px; padding: 8px 13px; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--caution); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
button.on { background: var(--text); color: var(--ink); border-color: var(--text); }
button.go { background: var(--go); color: var(--ink); border-color: var(--go); font-weight: 900; }
.card button { color: var(--ink); background: var(--paper); border: 3px solid var(--ink); }
.card button.go { background: var(--caution); }
.bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 100%; }
.bar .sep { width: 1px; background: var(--bar-line); margin: 4px 2px; }
.cnt { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .badge.pop { animation: none; } .caption { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="wrap" id="wrap">
    <div class="frame" id="frame">
      <canvas id="cv" aria-label="Vista aérea de la plaza y el escenario"></canvas>
      <div class="badge" id="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#111214" d="M12 2C6.9 2 3 5.6 3 10.3c0 2.7 1.3 4.9 3.4 6.3V20c0 1.1.9 2 2 2h7.2c1.1 0 2-.9 2-2v-3.4c2.1-1.4 3.4-3.6 3.4-6.3C21 5.6 17.1 2 12 2Zm-3.6 11.6a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2Zm7.2 0a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2ZM10 22v-2.4h1.2V22H10Zm2.8 0v-2.4H14V22h-1.2Z"/></svg>
        <span>PISOTEADOS</span><span class="num" id="dead">0</span>
      </div>
      <div class="caption" id="caption">Tú lo planeas</div>
      <div class="status" id="status" hidden></div>
      <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
    </div>
  </div>
  <div class="bar" id="bar">
    <button id="tFence" data-tool="fence" class="on">Valla <span class="cnt" id="cFence">60 m</span></button>
    <button id="tGate" data-tool="gate">Puertas <span class="cnt" id="cGate">3/5</span></button>
    <button id="tErase" data-tool="erase">Borrar</button>
    <span class="sep"></span>
    <button id="bHeat">Presión</button>
    <button id="bSpeed">1×</button>
    <button id="bGo" class="go">Abrir puertas</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
// ===== Mundo (metros) =====
const WW = 40, WH = 72, CS = .5, GW = WW / CS, GH = WH / CS;
const R = .24, DT = 1 / 60;
let PCRIT = 7;
const CROWD = 2200, FENCE_BUDGET = 60, MAX_GATES = 5, SHOW_TIME = 40;
const FENCE_Y = 66, SLOTS = 7, SLOT_W = 2.6;
const slotX = i => WW * (i + .5) / SLOTS;
let gates = [false, false, true, false, true, false, false];
let fences = [];           // vallas del jugador {ax,ay,bx,by,len}

// ===== Obstáculos =====
let obs = [], buckets, BKS = 2, BW = Math.ceil(WW / BKS), BH = Math.ceil(WH / BKS);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function seg(ax, ay, bx, by, th, kind) { obs.push({ t: "s", ax, ay, bx, by, th, kind }); }
function rect(x0, y0, x1, y1, kind) { obs.push({ t: "r", x0, y0, x1, y1, kind }); }
function circ(x, y, r, kind) { obs.push({ t: "c", x, y, r, kind }); }
const RING = { x: 20, y: 21.5, r: 4.8 };

function buildWorld() {
  obs = [];
  // bordes de la plaza
  seg(0, 0, 0, WH, .2, "edge"); seg(WW, 0, WW, WH, .2, "edge"); seg(0, 0, WW, 0, .2, "edge");
  // escenario, bocinas, pasarela y plataforma
  rect(6, 0, 34, 11, "stage");
  rect(2.6, 7.4, 4.8, 9.6, "speaker"); rect(35.2, 7.4, 37.4, 9.6, "speaker");
  rect(18.6, 11, 21.4, 18.5, "catwalk");
  circ(RING.x, RING.y, 3.2, "platform");
  // vallas negras del foso
  seg(0, 12.6, 17, 12.6, .5, "barrier"); seg(23, 12.6, WW, 12.6, .5, "barrier");
  seg(17, 12.6, 17, 18.4, .5, "barrier"); seg(23, 12.6, 23, 18.4, .5, "barrier");
  const n = 12;
  for (let k = 0; k < n; k++) {
    const a0 = (k + .5) / n * Math.PI * 2, a1 = (k + 1.5) / n * Math.PI * 2;
    const ax = RING.x + Math.cos(a0) * RING.r, ay = RING.y + Math.sin(a0) * RING.r;
    const bx = RING.x + Math.cos(a1) * RING.r, by = RING.y + Math.sin(a1) * RING.r;
    if ((ay + by) / 2 < RING.y - 2.5 && Math.abs((ax + bx) / 2 - RING.x) < 3) continue;
    seg(ax, ay, bx, by, .5, "barrier");
  }
  // carpa, puesto azul y primeros auxilios
  rect(17.5, 39.5, 22.5, 44.5, "tent");
  rect(2.5, 52, 5.5, 55, "booth");
  rect(34.5, 52, 37.5, 55, "aid");
  // reja de entrada con puertas
  let x = 0;
  for (let i = 0; i < SLOTS; i++) {
    const g0 = slotX(i) - SLOT_W / 2, g1 = slotX(i) + SLOT_W / 2;
    seg(x, FENCE_Y, g0, FENCE_Y, .3, "fence");
    if (!gates[i]) seg(g0, FENCE_Y, g1, FENCE_Y, .3, "closed");
    x = g1;
  }
  seg(x, FENCE_Y, WW, FENCE_Y, .3, "fence");
  for (const f of fences) seg(f.ax, f.ay, f.bx, f.by, .35, "player");
  // cubetas espaciales
  buckets = Array.from({ length: BW * BH }, () => []);
  obs.forEach((o, i) => {
    const [x0, y0, x1, y1] = bbox(o);
    for (let by = Math.max(0, Math.floor((y0 - 1) / BKS)); by <= Math.min(BH - 1, Math.floor((y1 + 1) / BKS)); by++)
      for (let bx = Math.max(0, Math.floor((x0 - 1) / BKS)); bx <= Math.min(BW - 1, Math.floor((x1 + 1) / BKS)); bx++) buckets[by * BW + bx].push(i);
  });
  buildFields();
  staticLayer = null;
  resetPreview();
}
function bbox(o) {
  if (o.t === "r") return [o.x0, o.y0, o.x1, o.y1];
  if (o.t === "c") return [o.x - o.r, o.y - o.r, o.x + o.r, o.y + o.r];
  return [Math.min(o.ax, o.bx) - o.th, Math.min(o.ay, o.by) - o.th, Math.max(o.ax, o.bx) + o.th, Math.max(o.ay, o.by) + o.th];
}
// distancia con signo a la superficie y normal hacia afuera
function contact(o, px, py) {
  if (o.t === "c") { const dx = px - o.x, dy = py - o.y, d = Math.hypot(dx, dy) || 1e-6; return [dx / d, dy / d, d - o.r]; }
  if (o.t === "r") {
    if (px > o.x0 && px < o.x1 && py > o.y0 && py < o.y1) {
      const m = [px - o.x0, o.x1 - px, py - o.y0, o.y1 - py], k = m.indexOf(Math.min(...m));
      return [[-1, 1, 0, 0][k], [0, 0, -1, 1][k], -m[k]];
    }
    const cx = clamp(px, o.x0, o.x1), cy = clamp(py, o.y0, o.y1), dx = px - cx, dy = py - cy, d = Math.hypot(dx, dy) || 1e-6;
    return [dx / d, dy / d, d];
  }
  const vx = o.bx - o.ax, vy = o.by - o.ay, l2 = vx * vx + vy * vy || 1e-9;
  const t = clamp(((px - o.ax) * vx + (py - o.ay) * vy) / l2, 0, 1);
  const cx = o.ax + vx * t, cy = o.ay + vy * t, dx = px - cx, dy = py - cy, d = Math.hypot(dx, dy);
  if (d < 1e-6) { const l = Math.sqrt(l2); return [-vy / l, vx / l, -o.th / 2]; }
  return [dx / d, dy / d, d - o.th / 2];
}

// ===== Campos de flujo =====
let blockedC, fStage, fExit, dirS, dirE;
function buildFields() {
  blockedC = new Uint8Array(GW * GH);
  obs.forEach(o => {
    const [x0, y0, x1, y1] = bbox(o);
    for (let gy = Math.max(0, Math.floor((y0 - R) / CS)); gy <= Math.min(GH - 1, Math.floor((y1 + R) / CS)); gy++)
      for (let gx = Math.max(0, Math.floor((x0 - R) / CS)); gx <= Math.min(GW - 1, Math.floor((x1 + R) / CS)); gx++)
        if (contact(o, (gx + .5) * CS, (gy + .5) * CS)[2] < R * .8) blockedC[gy * GW + gx] = 1;
  });
  // meta del show: junto a las vallas del foso
  const front = obs.filter(o => o.kind === "barrier");
  fStage = dijkstra(id => {
    if (blockedC[id]) return false;
    const px = (id % GW + .5) * CS, py = ((id / GW) | 0) * CS + CS / 2;
    if (py > 30) return false;
    return front.some(o => contact(o, px, py)[2] < 1.1);
  });
  fExit = dijkstra(id => !blockedC[id] && ((id / GW) | 0) >= GH - 2);
  dirS = dirField(fStage); dirE = dirField(fExit);
}
function dijkstra(goal) {
  const d = new Float64Array(GW * GH).fill(Infinity), heap = [];
  const push = (v, id) => { heap.push([v, id]); let i = heap.length - 1; while (i) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let s = i; if (l < heap.length && heap[l][0] < heap[s][0]) s = l; if (r < heap.length && heap[r][0] < heap[s][0]) s = r; if (s === i) break; [heap[s], heap[i]] = [heap[i], heap[s]]; i = s; } } return top; };
  for (let id = 0; id < GW * GH; id++) if (goal(id)) { d[id] = 0; push(0, id); }
  while (heap.length) {
    const [v, id] = pop(); if (v > d[id]) continue;
    const x = id % GW, y = (id / GW) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const n = ny * GW + nx; if (blockedC[n]) continue;
      if (dx && dy && (blockedC[y * GW + nx] || blockedC[ny * GW + x])) continue;
      const nv = v + (dx && dy ? 1.4142 : 1) * CS;
      if (nv < d[n]) { d[n] = nv; push(nv, n); }
    }
  }
  return d;
}
function dirField(f) {
  const dir = new Float32Array(GW * GH * 2);
  for (let id = 0; id < GW * GH; id++) {
    if (!isFinite(f[id])) continue;
    const x = id % GW, y = (id / GW) | 0;
    let gx = 0, gy = 0, bw = 0, bx = 0, by = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      if (dx && dy && (blockedC[y * GW + nx] || blockedC[ny * GW + x])) continue;
      const v = f[ny * GW + nx]; if (!isFinite(v)) continue;
      const w = (f[id] - v) / Math.hypot(dx, dy); if (w > 0) { gx += dx * w; gy += dy * w; }
      if (w > bw) { bw = w; bx = dx; by = dy; }
    }
    // sumar la mejor vecina rompe empates (por ejemplo, justo entre dos puertas)
    gx += bx * bw * 1.5; gy += by * bw * 1.5;
    const l = Math.hypot(gx, gy);
    if (l) { dir[id * 2] = gx / l; dir[id * 2 + 1] = gy / l; }
  }
  return dir;
}
const cellOf = (x, y) => clamp(Math.floor(y / CS), 0, GH - 1) * GW + clamp(Math.floor(x / CS), 0, GW - 1);

// ===== Multitud =====
const SHIRTS = ["#d8433b","#2f6fc4","#e8b631","#3d9a5b","#8a4fbf","#e07a2e","#f4f4f0","#2b2f35","#3fb3c4","#d0679b","#7a8c3a","#9b5a3c"];
const HEAT = ["#3b6fd8","#2fb4c9","#3fbf5a","#d9d23a","#f08a24","#e0322b"];
let ag = [], fallen = [], phase = "plan", spawned = 0, fullAt = 0, t = 0, evacT = 0, dead = 0, evacuated = 0;
let hashHead = new Int32Array(GW * GH), hashNext = new Int32Array(0);

function spawn() {
  const x = .6 + Math.random() * (WW - 1.2), y = FENCE_Y + 1.2 + Math.random() * (WH - FENCE_Y - 1.6);
  for (let i = Math.max(0, ag.length - 400); i < ag.length; i++) { const a = ag[i]; if ((a.x - x) ** 2 + (a.y - y) ** 2 < .3) return; }
  const e = Math.random();
  ag.push({ x, y, vx: 0, vy: -.5, h: -Math.PI / 2, v0: 1.35 + Math.random() * .5, tol: .8 + e * e * 26,
    leave: Math.random() * 16, p: 0, ps: 0, dmg: 0, c: (Math.random() * SHIRTS.length) | 0, fx: 0, fy: 0 });
  spawned++;
}

function step() {
  t += DT;
  const evac = phase === "evac"; if (evac) evacT += DT;
  if (phase === "show") {
    for (let k = 0; k < 10 && spawned < CROWD; k++) spawn();
    if (spawned >= CROWD) { if (!fullAt) { fullAt = t; caption("Empieza el show", false, 2200); } if (t > fullAt + SHOW_TIME) startEvac(); }
  }
  hashHead.fill(-1); if (hashNext.length < ag.length) hashNext = new Int32Array(ag.length * 2);
  for (let i = 0; i < ag.length; i++) { const a = ag[i], id = cellOf(a.x, a.y); hashNext[i] = hashHead[id]; hashHead[id] = i; a.p = 0; a.fx = 0; a.fy = 0; }
  for (let i = 0; i < ag.length; i++) {
    const a = ag[i], cx = clamp(Math.floor(a.x / CS), 0, GW - 1), cy = clamp(Math.floor(a.y / CS), 0, GH - 1);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      for (let j = hashHead[ny * GW + nx]; j !== -1; j = hashNext[j]) {
        if (j <= i) continue;
        const b = ag[j], ex = b.x - a.x, ey = b.y - a.y, d2 = ex * ex + ey * ey;
        if (d2 >= 4 * R * R || d2 < 1e-10) continue;
        const d = Math.sqrt(d2), ov = 2 * R - d, f = 60 * ov, ux = ex / d, uy = ey / d;
        a.fx -= ux * f; a.fy -= uy * f; b.fx += ux * f; b.fy += uy * f;
        const pp = ov / (2 * R) * 3; a.p += pp; b.p += pp;
      }
    }
  }
  const out = [];
  for (const a of ag) {
    const leaving = evac && evacT > a.leave;
    const id = cellOf(a.x, a.y), f = leaving ? fExit : fStage, dir = leaving ? dirE : dirS;
    let want = leaving ? a.v0 * 1.25 : (f[id] > a.tol ? a.v0 : 0);
    let dx = dir[id * 2], dy = dir[id * 2 + 1];
    if (!isFinite(f[id])) {
      // atrapado en una celda bloqueada: buscar la celda libre más cercana
      const gx = id % GW, gy = (id / GW) | 0; let best = Infinity;
      for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
        const nx = gx + ox, ny = gy + oy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
        const v = isFinite(f[ny * GW + nx]) ? Math.hypot(ox, oy) + f[ny * GW + nx] * 1e-3 : Infinity;
        if (v < best) { best = v; const l = Math.hypot(ox, oy); dx = ox / l; dy = oy / l; }
      }
      want = isFinite(best) ? a.v0 * .6 : 0;
    }
    if (leaving && f[id] === 0) { dx = 0; dy = 1; }
    a.vx += ((dx * want - a.vx) / .5 + a.fx) * DT;
    a.vy += ((dy * want - a.vy) / .5 + a.fy) * DT;
    const sp = Math.hypot(a.vx, a.vy); if (sp > 2.6) { a.vx *= 2.6 / sp; a.vy *= 2.6 / sp; }
    a.x += a.vx * DT; a.y += a.vy * DT;
    if (sp > .15) a.h = Math.atan2(a.vy, a.vx);
    // choques con escenario, vallas y reja
    const bk = buckets[clamp(Math.floor(a.y / BKS), 0, BH - 1) * BW + clamp(Math.floor(a.x / BKS), 0, BW - 1)];
    for (const oi of bk) {
      const [nx, ny, d] = contact(obs[oi], a.x, a.y);
      if (d >= R) continue;
      const ov = R - d; a.x += nx * ov; a.y += ny * ov;
      const vn = a.vx * nx + a.vy * ny; if (vn < 0) { a.vx -= vn * nx; a.vy -= vn * ny; }
      a.p += ov / R * 1.5;
    }
    a.x = clamp(a.x, R, WW - R);
    if (!evac) a.y = Math.min(a.y, WH - R);
    a.ps += (a.p - a.ps) * .1;
    if (a.p > PCRIT) a.dmg += (a.p - PCRIT) * DT * 1.6; else a.dmg = Math.max(0, a.dmg - DT * .4);
